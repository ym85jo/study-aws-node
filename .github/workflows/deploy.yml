name: Deploy Node.js Express App to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스코드 체크아웃
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. AWS 자격 증명 설정
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    # 3. AWS ECR 로그인
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 4. Docker 이미지 빌드 및 ECR 푸시
    - name: Build, Tag, and Push Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: study-app-node
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 5. EC2에 SSH 접속하여 배포 (상세 디버깅 옵션 적용)
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        debug: true              # SSH 연결 및 실행 상세 로그 출력 활성화
        script_stop: true        # 스크립트 내 명령 오류 발생 시 즉시 중단 및 에러 출력
        script: |
          set -e
          set -x                 # 실행되는 모든 Bash 명령어를 트레이스(추적) 로그로 출력

          echo "=== 1. Docker 네트워크 확인 ==="
          docker network create app-network || true

          echo "=== 2. .env 환경변수 파일 생성 ==="
          cat << 'EOF' > .env
          NODE_ENV=production
          PORT=3000
          DB_HOST=database-yeongmin.c1kesew8onxs.ap-northeast-2.rds.amazonaws.com
          DB_PORT=3306
          DB_USER=admin
          DB_PASSWORD=dkakwhsRh!1
          DB_NAME=db_yeongmin
          EOF

          echo "=== 3. ECR 로그인 및 최신 이미지 수신 ==="
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 905905585641.dkr.ecr.ap-northeast-2.amazonaws.com
          docker pull 905905585641.dkr.ecr.ap-northeast-2.amazonaws.com/study-app-node:latest

          echo "=== 4. 기존 컨테이너 중지 및 삭제 ==="
          docker stop express_app || true
          docker rm express_app || true

          echo "=== 5. 새 컨테이너 실행 ==="
          docker run -d \
            --name express_app \
            --network app-network \
            --env-file .env \
            -p 3000:3000 \
            --restart always \
            905905585641.dkr.ecr.ap-northeast-2.amazonaws.com/study-app-node:latest

          echo "=== 6. 생성된 .env 임시 파일 삭제 ==="
          rm -f .env

          echo "=== 7. 컨테이너 구동 상태 확인 ==="
          sleep 3
          docker ps | grep express_app
